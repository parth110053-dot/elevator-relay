  for (const v of world.vehs) if (v !== P && v.alive) { if (state.cd > 0) { v.thr = 0; v.str = 0; } else aiUpdate(v, dt); }
  for (const v of world.vehs) if (v.alive) updateVeh(v, dt);
  for (const v of world.vehs) if (v.alive) collideBuildings(v);
  collideVehicles();
  updateProjs(dt); updatePickups(dt); modeUpdate(dt); updateParticles(dt); updateFires();
  for (const w of world.wrecks) if (w.t > 0) { w.t -= dt; if ((state.t * 60 | 0) % 4 === 0) emit(w.x + (rng() - 0.5), 1.2, w.z + (rng() - 0.5), 0, 3, 0, 1.0, 1.1, 0x2a2c31, 2.5, -0.5, 0.6); }
  world.shake = Math.max(0, world.shake - dt * 1.6);
  updateCamera(dt); syncMeshes();
  if (engine && audio) { const sp = Math.abs(P.speed || 0); engine.o.frequency.value = 50 + sp * 4.2; engine.g.gain.value = muted || !P.alive ? 0 : 0.05 * tune.volume * (0.5 + P.thr * 0.5); }
  if (state.endT > 0) { state.endT -= dt; if (state.endT <= 0) { if (engine) engine.g.gain.value = 0; scene = state.result === 'win' ? 'results' : 'over'; if (scene === 'results') tone(660, 0.4, 'triangle', 0.25, 400); } }
}
function showWorld(play) { runGroup.visible = play; if (showcase.mesh) showcase.mesh.visible = !play; }
function drawWorldFrame() { applyCamera(); renderer.render(scene3, camera); ctx.clearRect(0, 0, W, H); }
function project(x, y, z) { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H, v.z]; }

function drawHUD() {
  const P = world.P, mode = state.mode, now = state.t;
  const hpF = clamp(state.hp / state.maxHp, 0, 1);
  if (hpF < 0.35 && P.alive) { const a = (0.35 - hpF) * 1.3 * (0.6 + 0.4 * Math.sin(now * 6)); const gr = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85); gr.addColorStop(0, 'rgba(160,0,0,0)'); gr.addColorStop(1, `rgba(160,0,0,${a})`); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
  if (P.flash > 0) { ctx.fillStyle = `rgba(255,60,30,${P.flash * 1.6})`; ctx.fillRect(0, 0, W, H); }
  // round minimap, heading up
  const mx = 112, my = 112, R = 90, k = 1.15;
  ctx.save(); ctx.beginPath(); ctx.arc(mx, my, R, 0, 6.2832); ctx.clip();
  ctx.fillStyle = '#1a1d24'; ctx.fillRect(mx - R, my - R, R * 2, R * 2);
  ctx.translate(mx, my); ctx.rotate(P.h + Math.PI); ctx.translate(-(P.x + 180) * k, -(P.z + 180) * k);
  ctx.drawImage(window.__minimap, 0, 0, 360 * k, 360 * k);
  const mp = (x, z) => [(x + 180) * k, (z + 180) * k];
  for (const q of world.pickups) if (q.on) { const [a, b] = mp(q.x, q.z); ctx.fillStyle = '#' + PICK_COLORS[q.type].toString(16).padStart(6, '0'); ctx.fillRect(a - 2.5, b - 2.5, 5, 5); }
  for (const v of world.vehs) if (v.alive && v !== P) { const [a, b] = mp(v.x, v.z); ctx.fillStyle = v.kind === 'police' ? '#6aa0ff' : v.kind === 'racer' ? '#' + (v.color || 0xffffff).toString(16).padStart(6, '0') : '#ff4d3a'; ctx.beginPath(); ctx.arc(a, b, 3.5, 0, 6.3); ctx.fill(); }
  if (mode === 'race' && state.cd <= 0) { const n = RACE_WPS[P.wp % RACE_WPS.length], [a, b] = mp(n[0], n[1]); ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(a, b, 7, 0, 6.3); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(mx, my - 8); ctx.lineTo(mx + 6, my + 6); ctx.lineTo(mx - 6, my + 6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ff7a2a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(mx, my, R, 0, 6.3); ctx.stroke();
  // kill feed
  state.feed.forEach((f, i) => { const age = now - f.t0; if (age > 6) return; ctx.globalAlpha = clamp(1.6 - age / 4, 0, 1); label(f.txt, 18, 226 + i * 24, 18, '#ffd9c2', 'left'); ctx.globalAlpha = 1; });
  // weapons, top centre
  WEAPONS.forEach((w, i) => {
    const x = W / 2 - 138 + i * 94, on = state.weapon === w;
    ctx.fillStyle = on ? 'rgba(255,150,60,0.4)' : 'rgba(10,10,20,0.45)'; ctx.fillRect(x, 14, 86, 62); ctx.strokeStyle = on ? '#ff9a3c' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.strokeRect(x, 14, 86, 62);
    ctx.fillStyle = '#' + PICK_COLORS[w].toString(16).padStart(6, '0');
    if (w === 'mg') { for (let q = 0; q < 3; q++) ctx.fillRect(x + 26 + q * 12, 20, 7, 24); }
    else if (w === 'missile') { ctx.fillRect(x + 24, 28, 32, 8); ctx.beginPath(); ctx.moveTo(x + 56, 22); ctx.lineTo(x + 68, 32); ctx.lineTo(x + 56, 42); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(x + 43, 32, 10, 0, 6.3); ctx.fill(); for (let a = 0; a < 6; a++) { ctx.beginPath(); ctx.arc(x + 43 + Math.cos(a * 1.05) * 14, 32 + Math.sin(a * 1.05) * 14, 3, 0, 6.3); ctx.fill(); } }
    label(`${state.ammo[w]}`, x + 43, 62, 18, state.ammo[w] > 0 ? '#fff' : '#ff8a7a'); label(`${i + 1}`, x + 8, 22, 13, '#d7dce8');
  });
  label(({ mg: 'MACHINE GUN', missile: 'MISSILES', mine: 'MINES' })[state.weapon], W / 2, 96, 17, '#ffd9c2');
  // score and objective, top right
  label(`SCORE ${state.score}`, W - 24, 34, 28, '#ffffff', 'right');
  if (state.combo > 1) label(`COMBO x${state.combo}`, W - 24, 64, 22, '#ff9a3a', 'right');
  if (mode === 'wreck') label(`WRECKED ${state.kills} / ${state.target}`, W - 24, state.combo > 1 ? 94 : 66, 26, '#ffd23a', 'right');
  else if (mode === 'escape') { const t = Math.ceil(state.timeLeft); label(`SURVIVE ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`, W - 24, 66, 26, '#ffd23a', 'right'); label(`COPS ${state.alive}`, W - 24, 94, 20, '#8db4ff', 'right'); }
  else {
    label(`LAP ${state.lap}/${state.laps}`, W - 24, 66, 26, '#ffd23a', 'right');
    (state.board || []).forEach((n, i) => label(`${i + 1}. ${n}`, W - 24, 130 + i * 25, 20, n === 'YOU' ? '#ffd23a' : '#ffd9c2', 'right'));
    if (state.cd <= 0) { const n = RACE_WPS[P.wp % RACE_WPS.length], a = angDiff(Math.atan2(n[0] - P.x, n[1] - P.z), world.camAng); ctx.save(); ctx.translate(W / 2, 138); ctx.rotate(a); ctx.fillStyle = '#ffd23a'; ctx.strokeStyle = '#1a1020'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(16, 12); ctx.lineTo(0, 4); ctx.lineTo(-16, 12); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore(); }
  }
  // enemy markers
  let target = null, td = 1e9;
  for (const v of world.vehs) { if (!v.alive || v === P) continue; const d = Math.hypot(v.x - P.x, v.z - P.z); if (d < td) { td = d; target = v; } }
  for (const v of world.vehs) {
    if (!v.alive || v === P) continue; const d = Math.hypot(v.x - P.x, v.z - P.z); if (d > 170) continue;
    const [sx, sy, sz] = project(v.x, v.y + (v.kind === 'tanker' || v.kind === 'tank' ? 4.4 : 3.1), v.z);
    if (sz > 1 || sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    ctx.fillStyle = v.kind === 'police' ? '#5b8cff' : v.kind === 'racer' ? '#' + (v.color || 0xff4d3a).toString(16).padStart(6, '0') : '#ff3b30'; ctx.strokeStyle = 'rgba(10,6,12,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx - 9, sy - 12); ctx.lineTo(sx + 9, sy - 12); ctx.lineTo(sx, sy + 2); ctx.closePath(); ctx.stroke(); ctx.fill();
    if (d < 75) label(v.name, sx, sy - 26, 16, '#ffd9c2');
    if (v === target && d > 14) label(`${Math.round(d)}m`, sx, sy - 44, 18, '#ffe066');
  }
  for (const p of world.popups) { const [sx, sy] = project(p.x, 3 + p.t * 3, p.z); ctx.globalAlpha = clamp(1.4 - p.t, 0, 1); label(p.txt, sx, sy, 26, p.col); ctx.globalAlpha = 1; }
  // health, bottom centre
  const hw = 340, hx = W / 2 - hw / 2, hy = H - 50;
  ctx.fillStyle = 'rgba(10,10,20,0.55)'; ctx.fillRect(hx - 8, hy - 10, hw + 16, 38); ctx.fillStyle = '#2a2f3a'; ctx.fillRect(hx, hy, hw, 18);
  ctx.fillStyle = hpF > 0.5 ? '#3ddc84' : hpF > 0.25 ? '#ffb020' : '#ff4d3a'; ctx.fillRect(hx, hy, hw * hpF, 18);
  label(`${KIND[P.kind].name.toUpperCase()}  ${Math.ceil(state.hp)}`, W / 2, hy + 9, 16, '#fff');
  // speed dial, bottom right
  const dx = W - 90, dy = H - 90, top = (tune[P.kind + '_top_speed'] || 30) * 3.6 * 1.1, kmh = Math.abs(P.speed || 0) * 3.6;
  ctx.fillStyle = 'rgba(10,10,20,0.6)'; ctx.beginPath(); ctx.arc(dx, dy, 62, 0, 6.3); ctx.fill(); ctx.strokeStyle = '#ff7a2a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(dx, dy, 62, 0, 6.3); ctx.stroke();
  for (let t = 0; t <= 10; t++) { const a = 3.93 + t / 10 * 4.71; ctx.strokeStyle = t > 8 ? '#ff4d3a' : '#d7dce8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(dx + Math.sin(a) * 50, dy - Math.cos(a) * 50); ctx.lineTo(dx + Math.sin(a) * 58, dy - Math.cos(a) * 58); ctx.stroke(); }
  const na = 3.93 + clamp(kmh / top, 0, 1) * 4.71; ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + Math.sin(na) * 46, dy - Math.cos(na) * 46); ctx.stroke();
  label(`${Math.round(kmh)}`, dx, dy + 30, 22, '#fff'); label('km/h', dx, dy + 48, 13, '#cfd6e4');
  if (mode === 'race') {
    label(`${state.place}/${state.racers}`, 24, H - 40, 44, state.place <= 2 ? '#7dffb0' : '#ff8a7a', 'left');
    if (state.cd > 0) label(state.cd > 3 ? 'GET READY' : String(Math.ceil(state.cd)), W / 2, H / 2 - 60, 90, '#ffd23a');
    else if (state.t < 5.4) label('GO!', W / 2, H / 2 - 60, 90, '#7dffb0');
  }
  if (state.hint > 0 && state.cd <= 0) label(mode === 'race' ? 'Follow the yellow arrow. F fires, Space drifts.' : 'W/A/S/D drive, F fire, Space drift. Grab glowing pickups.', W / 2, 160, 22, '#ffffff');
  if (!P.alive) label('WRECKED', W / 2, H / 2 - 40, 80, '#ff4d3a');
  if (hpF < 0.25 && P.alive && (state.t * 3 | 0) % 2) label('LOW HEALTH', W / 2, H - 70, 22, '#ff8a7a');
}

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      cityGroup.visible = false; runGroup.visible = false; figGroup.visible = true; dome.visible = false;
      while (figGroup.children.length) figGroup.remove(figGroup.children[0]);
      const order = ['car', 'bike', 'tank', 'rc', 'chaser', 'rammer', 'shooter', 'flanker', 'police', 'racer', 'tanker']; const pos = [];
      order.forEach((k, i) => { const m = buildVehicle(k, 0x3a86ff); m.position.set(50 - i * 10, 0, 0); m.rotation.y = 0.5; figGroup.add(m); pos.push([50 - i * 10, k]); });
      camera.fov = 52; camera.updateProjectionMatrix(); camera.position.set(0, 30, 900 - 58); camera.lookAt(0, 0, 900 + 1); renderer.setClearColor(0x2c3a4a);
      renderer.render(scene3, camera); ctx.clearRect(0, 0, W, H);
      for (const [x, k] of pos) { const [sx, sy] = project(x, 0, figGroup.position.z + 5); label(KIND[k].name, sx, sy + 44, 17, '#fff'); }
      cityGroup.visible = true; figGroup.visible = false; dome.visible = true; renderer.setClearColor(0x7a3a2c);
    },
  },
  title: {
    update() {
      if (pressed('ArrowLeft') || pressed('KeyA')) sel.veh = (sel.veh + VEHS.length - 1) % VEHS.length;
      if (pressed('ArrowRight') || pressed('KeyD')) sel.veh = (sel.veh + 1) % VEHS.length;
      if (pressed('ArrowUp') || pressed('KeyW')) sel.mode = (sel.mode + 2) % 3; if (pressed('ArrowDown') || pressed('KeyS')) sel.mode = (sel.mode + 1) % 3;
      state.t += STEP; setShowcase();
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; }
    },
    draw() {
      showWorld(false); setShowcase(); const a = state.t * 0.45;
      showcase.mesh.rotation.y = state.t * 0.5; const kk = clamp(KIND[showcase.kind].r / 1.45, 0.8, 1.7);
      camera.fov = 52; camera.updateProjectionMatrix();
      camera.position.set(Math.sin(a) * 10 * kk, 2.6 * kk, Math.cos(a) * 10 * kk); camera.lookAt(0, 1.1, 0); dome.position.copy(camera.position);
      renderer.render(scene3, camera); ctx.clearRect(0, 0, W, H);
      const g = ctx.createLinearGradient(0, 0, 0, 230); g.addColorStop(0, 'rgba(8,6,14,0.85)'); g.addColorStop(1, 'rgba(8,6,14,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 230);
      label(TITLE, W / 2, 80, 72, '#ff9a3c');
      label('Wreck. Race. Escape.', W / 2, 140, 26, '#ffffff');
      panel(W / 2 - 340, 410, 680, 262, 0.65);
      label('MODE  (Up / Down)', W / 2, 434, 17, '#c9a98a');
      MODES.forEach((m, i) => label(m.name, W / 2, 470 + i * 34, i === sel.mode ? 32 : 22, i === sel.mode ? '#ffd23a' : '#cfd6e4'));
      label(MODES[sel.mode].desc, W / 2, 576, 20, '#ffffff');
      label(`VEHICLE  (Left / Right):  < ${VEHS[sel.veh].name} >`, W / 2, 610, 21, '#7dffb0');
      label(VEHS[sel.veh].desc, W / 2, 638, 18, '#cfe9d8');
      label('ENTER to start', W / 2, 664, 22, '#ffd23a');
      panel(18, 270, 300, 200, 0.55);
      ['W/A/S/D or arrows: drive', 'Space: handbrake drift', 'F or Shift: fire', 'Q / 1-2-3: switch weapon', 'P: pause   M: mute'].forEach((c, i) => label(c, 32, 296 + i * 34, 19, '#ffffff', 'left'));
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      simulate(dt);
    },
    draw() { showWorld(true); drawWorldFrame(); drawHUD(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; if (pressed('KeyT')) { scene = 'title'; } },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(8,10,20,0.55)'; ctx.fillRect(0, 0, W, H); label('PAUSED', W / 2, H / 2 - 20, 70, '#fff'); label('P to resume   T for title   M mute', W / 2, H / 2 + 40, 24, '#cfd6e4'); },
  },
  over: {
    update(dt) { simulateIdle(dt); if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; } if (pressed('KeyT')) scene = 'title'; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(40,6,6,0.55)'; ctx.fillRect(0, 0, W, H);
      label('GAME OVER', W / 2, H / 2 - 70, 78, '#ff4d3a'); label(state.gained || 'Wrecked', W / 2, H / 2 - 5, 32, '#fff');
      label(`Score ${state.score}   Wrecked ${state.kills}`, W / 2, H / 2 + 40, 26, '#ffd23a'); label('R / Enter: retry     T: title', W / 2, H / 2 + 90, 24, '#cfd6e4');
    },
  },
  results: {
    update(dt) { simulateIdle(dt); if (pressed('Enter') || pressed('KeyR')) { reset(); scene = 'play'; } if (pressed('KeyT')) scene = 'title'; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(6,30,14,0.55)'; ctx.fillRect(0, 0, W, H);
      label('YOU WIN', W / 2, H / 2 - 70, 78, '#7dffb0'); label(state.gained || 'Done', W / 2, H / 2 - 5, 32, '#fff');
      label(`Score ${state.score}   Wrecked ${state.kills}   Time ${Math.round(state.t)}s`, W / 2, H / 2 + 40, 26, '#ffd23a'); label('Enter: play again     T: title', W / 2, H / 2 + 90, 24, '#cfd6e4');
    },
  },
};
function simulateIdle(dt) { updateParticles(dt); world.shake = 0; }

// ---- Loop --------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
  if (engine && audio && scene !== 'play') engine.g.gain.value = 0;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') showWorld(true);
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
